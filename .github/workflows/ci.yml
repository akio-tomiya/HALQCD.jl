name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - "1.10"
          - "1"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  # The JuliaQCD extension on the v1 path (Gaugefields 1.1.x, LatticeMatrices.jl
  # MPILattice fields), against the reference propagators of HALQCD.jl.
  juliaqcd-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - uses: julia-actions/cache@v2
      - name: Extension tests
        run: |
          julia --threads=2 --project=test/juliaqcd_v1 -e '
            using Pkg
            Pkg.instantiate()
            Pkg.status()
            include("test/juliaqcd_v1/runtests.jl")'
      # Same MPI launcher as the CI of LatticeMatrices.jl (mpiexecjl of MPI.jl,
      # with the MPICH binaries of MPICH_jll), on one runner.
      - name: Extension tests on 2 and 4 MPI processes
        run: |
          julia --project=test/juliaqcd_v1 --startup-file=no -e '
            using MPI
            MPI.install_mpiexecjl(destdir=".ci-bin", force=true)'
          .ci-bin/mpiexecjl --project=test/juliaqcd_v1 -n 2 \
            julia --project=test/juliaqcd_v1 --startup-file=no test/juliaqcd_v1/mpi_runtests.jl
          .ci-bin/mpiexecjl --project=test/juliaqcd_v1 -n 4 \
            julia --project=test/juliaqcd_v1 --startup-file=no test/juliaqcd_v1/mpi_runtests.jl
